name: Test EVO Trading AI PC v0.5

on:
  push:
    branches: ["evo-trading-pc-v0.5"]
    paths:
      - "evo-trading-ai/v0.5-pc/**"
      - ".github/workflows/evo-trading-pc-v05.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evo-trading-ai/v0.5-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
