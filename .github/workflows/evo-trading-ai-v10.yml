name: Test EVO Trading AI 1.0

on:
  push:
    branches: ["evo-trading-ai-v1.0"]
    paths:
      - "evo-trading-ai/v1.0-freqai/**"
      - ".github/workflows/evo-trading-ai-v10.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evo-trading-ai/v1.0-freqai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Compile tools
        run: python -m py_compile tools/export_diagnostics.py
      - name: Unit and safety tests
        run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config
      - name: Validate strategy inside Freqtrade stable_freqai
        run: |
          mkdir -p user_data/logs user_data/models user_data/data user_data/backtest_results diagnostics
          docker compose pull
          docker compose run --rm freqtrade list-strategies --strategy-path /freqtrade/user_data/strategies | tee /tmp/strategies.txt
          grep -q EvoFreqAiStrategy /tmp/strategies.txt
