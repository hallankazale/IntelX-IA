name: Build EVO Trading AI v0.4 APK

on:
  push:
    branches: ["evo-trading-lab-v0.4"]
    paths:
      - "evo-trading-ai/v0.3/project/**"
      - ".github/workflows/evo-trading-ai-v03.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evo-trading-ai/v0.3/project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evo-trading-ai-v0.4-debug
          path: evo-trading-ai/v0.3/project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
